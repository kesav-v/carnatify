[workspace]
resolver = "2"
members = [
    "crates/carnatify-core",
    "crates/carnatify-wasm",
    "examples/rust",
]
default-members = ["crates/carnatify-core", "crates/carnatify-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kesav/carnatify"
rust-version = "1.85"

[workspace.dependencies]
carnatify-core = { path = "crates/carnatify-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
