[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "carnatify"
version = "0.1.0"
description = "Carnatic notation parser (Rust core)"
requires-python = ">=3.9"

[tool.maturin]
manifest-path = "../crates/carnatify-py/Cargo.toml"
module-name = "carnatify._carnatify_native"
python-source = "."
features = ["pyo3/extension-module"]

[tool.maturin.env]
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"
